[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamepulse"
version = "0.1.0"
description = "End-to-end data engineering and analytics platform for video game market intelligence."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]